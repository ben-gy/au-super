name: Data Pipeline

on:
  schedule:
    # Source cadence: ANNUAL. APRA publishes the MySuper Comprehensive Product
    # Performance Package (CPPP) once a year, in January. Annual cron matches it;
    # anything faster would re-fetch an unchanged file. Staggered to 8 Feb 06:23.
    - cron: '23 6 8 2 *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**']

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node pipeline/collect.mjs
      - run: node pipeline/aggregate.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || (git pull --rebase && git push)
